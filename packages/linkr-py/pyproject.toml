[project]
name = "linkr"
version = "0.1.0"
description = "Reach the current Linkr project from a script running in its IDE"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["duckdb>=0.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkr"]
