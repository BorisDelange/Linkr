# A package mirror shaped like a Nexus Repository proxy — the usual way an SPE
# reaches PyPI and CRAN without reaching the internet. Same URL layout as Nexus
# proxy repositories (/repository/<name>/), so the Linkr settings written against
# this one are the ones an administrator writes against a real Nexus or Artifactory.
#
#   PyPI : http://mirror/repository/pypi/simple
#   CRAN : http://mirror/repository/cran/latest                       (source packages)
#          http://mirror/repository/cran/__linux__/noble/latest       (Ubuntu 24.04 binaries)

proxy_cache_path /var/cache/nginx/mirror levels=1:2 keys_zone=mirror:10m max_size=5g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name mirror;

    resolver 127.0.0.11 valid=60s ipv6=off;
    proxy_ssl_server_name on;

    # The simple index points every file at files.pythonhosted.org, which the SPE
    # cannot reach: rewrite those links to come back through here. Upstream must
    # answer uncompressed for sub_filter to see the text.
    location /repository/pypi/simple/ {
        set $pypi pypi.org;
        rewrite ^/repository/pypi/simple/(.*)$ /simple/$1 break;
        proxy_pass https://$pypi;
        proxy_set_header Host pypi.org;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/vnd.pypi.simple.v1+json application/vnd.pypi.simple.v1+html;
        sub_filter 'https://files.pythonhosted.org/' 'http://$http_host/repository/pypi/files/';
        sub_filter_once off;
    }

    location /repository/pypi/files/ {
        set $files files.pythonhosted.org;
        rewrite ^/repository/pypi/files/(.*)$ /$1 break;
        proxy_pass https://$files;
        proxy_set_header Host files.pythonhosted.org;
        proxy_cache mirror;
        proxy_cache_valid 200 30d;
    }

    location /repository/cran/ {
        set $cran packagemanager.posit.co;
        rewrite ^/repository/cran/(.*)$ /cran/$1 break;
        proxy_pass https://$cran;
        proxy_set_header Host packagemanager.posit.co;
        proxy_cache mirror;
        proxy_cache_valid 200 1d;
        # Upstream marks its redirects cacheable too, and a redirect replayed from
        # the cache skips the interception below: cache only what proxy_cache_valid says.
        proxy_ignore_headers Cache-Control Expires;
        # Binaries answer 307 to a CDN host the SPE cannot resolve: follow it here,
        # as Nexus does, so the client only ever talks to the mirror.
        proxy_intercept_errors on;
        error_page 301 302 307 = @follow_redirect;
    }

    location @follow_redirect {
        set $target $upstream_http_location;
        proxy_pass $target;
        proxy_cache mirror;
        proxy_cache_key $target;
        proxy_cache_valid 200 30d;
    }
}
