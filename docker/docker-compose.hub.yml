# Run Linkr from the published images — no clone, no build.
#
# This file is self-contained: it is the ONE thing a user needs. Download it,
# set a key, and start. `docker-compose.yml` next to it builds from source
# instead, which is what you want when developing on Linkr itself.
#
#   curl -O https://framagit.org/interhop/linkr/linkr/-/raw/main/docker/docker-compose.hub.yml
#   export LINKR_SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(48))")
#   docker compose -f docker-compose.hub.yml up
#
# Then open http://localhost:3000 — the setup wizard takes it from there.
#
# The version is pinned on purpose. `latest` would let a `pull` move the app
# under a running instance without anyone asking for it, and two people
# following the same instructions would not get the same thing.
#
# To upgrade, change BOTH lines to the new version — they stamp the same
# export-format version, and a mixed pair writes exports that disagree about
# their own format. Available versions:
# https://hub.docker.com/r/interhop/linkr/tags
services:
  web:
    image: interhop/linkr:web-2.4.1
    ports:
      - "3000:80"
    depends_on:
      - api

  api:
    image: interhop/linkr:api-2.4.1
    ports:
      - "8000:8000"
    environment:
      - LINKR_DATABASE_URL=sqlite+aiosqlite:////root/.linkr/linkr.db
      - LINKR_DATA_DIR=/root/.linkr
      # Signs login tokens and encrypts the passwords of registered databases.
      # Generate it once and keep it: changing it logs everyone out and makes
      # already-registered database passwords unreadable.
      - LINKR_SECRET_KEY=${LINKR_SECRET_KEY:?generate one - see the header of this file}
      - LINKR_CORS_ORIGINS=http://localhost:3000
      - LINKR_DEBUG=false
    volumes:
      # Everything your users create lives here — the database and every file.
      # This is what you back up; the images hold no data of their own.
      #
      # A named volume by default: it survives restarts, `down`, and image
      # updates, but Docker owns it and it is awkward to reach, copy or back up
      # with ordinary tools. To keep the data in a REAL folder you can see and
      # archive, replace the line below with a path of your own:
      #
      #   - ./linkr-data:/root/.linkr        (beside this file)
      #   - /srv/linkr:/root/.linkr          (a server path)
      #
      # Docker creates it if missing; nothing else changes. Only `down -v`
      # deletes a named volume — a bind-mounted folder is never touched, which
      # is the other reason to prefer one for anything you care about.
      - linkr-data:/root/.linkr

volumes:
  linkr-data:
