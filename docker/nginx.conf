# WS-aware Connection header: "upgrade" during a WebSocket handshake, default
# otherwise. conf.d files are included at http level, so a map is valid here.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Dataset/blob uploads go through this proxy; allow large bodies.
    client_max_body_size 512m;

    # SPA: route all requests to index.html. The headers are set here, not at
    # server level: the API sets its own, stricter ones, and nginx would send both.
    #
    # The CSP leaves script-src alone on purpose: R/Python widgets (plotly,
    # leaflet, DT) render in sandboxed srcdoc iframes, which inherit this policy
    # and run inline scripts. What it does forbid: being framed by another site,
    # a <base> rewriting every relative URL, plugins, and forms posting elsewhere.
    # HSTS belongs on the TLS endpoint (the SPE's reverse proxy), not on this
    # plain-HTTP server.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }

    # Proxy API requests to backend. Long read timeout: server-side R/Python
    # executions and big DuckDB queries can run well past the 60s default.
    # Upgrade headers: the execution terminal opens a WebSocket on
    # /api/v1/execute/terminal (not under /ws/), so this block must support
    # the WS handshake too.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy WebSocket requests (streaming terminal / kernel). Keep the upgrade
    # headers and hold the connection open for long-lived sessions.
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
