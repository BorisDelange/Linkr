# Fullstack deployment (front + API + nginx proxy), SQLite in a named volume.
# From the repo root:  docker compose -f docker/docker-compose.yml up --build
#
# Set LINKR_SECRET_KEY in the environment before `up` (Fernet + JWT signing key):
#   export LINKR_SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(48))")
services:
  web:
    build:
      # Root context so the Dockerfile can reach both apps/web and docker/.
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        # Truthy => isServerMode() true; "/" keeps API calls relative so nginx
        # proxies them to the api service (backend URL never baked in).
        VITE_API_URL: /
        # Serving under a sub-path behind a reverse proxy that does NOT strip
        # the prefix: set BASE_PATH (e.g. /linkr/) — it also becomes the
        # VITE_API_URL default, so drop the line above to inherit it.
        # BASE_PATH: /
    ports:
      - "3000:80"
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      # Loopback only: the web container reaches the API over the compose
      # network; publishing it on every interface would bypass nginx.
      - "127.0.0.1:8000:8000"
    environment:
      - LINKR_DATABASE_URL=sqlite+aiosqlite:////var/lib/linkr/linkr.db
      - LINKR_DATA_DIR=/var/lib/linkr
      - LINKR_SECRET_KEY=${LINKR_SECRET_KEY:?set LINKR_SECRET_KEY before up}
      - LINKR_CORS_ORIGINS=http://localhost:3000
      - LINKR_DEBUG=false
      # Sign-in by the SPE gateway's header (off unless all three are set). The
      # gateway must overwrite both headers on every request; the secret (≥ 32
      # chars) is what proves a request came through it — every request reaches
      # the API from nginx, a kernel's included. Keep uvicorn's
      # FORWARDED_ALLOW_IPS at its default: widened, the peer address is read
      # from X-Forwarded-For, which a client chooses.
      # - LINKR_TRUSTED_HEADER=X-Remote-User
      # - LINKR_TRUSTED_PROXIES=172.16.0.0/12
      # - LINKR_TRUSTED_PROXY_SECRET=${LINKR_TRUSTED_PROXY_SECRET}
    volumes:
      - linkr-data:/var/lib/linkr

  # MCP server: lets agents (LibreChat, OpenCode…) act on this instance, each with
  # their own Linkr API key (User settings → API keys). Point the client at
  # http://127.0.0.1:3940/mcp. A request without a valid key is refused.
  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
    ports:
      # Loopback only: API keys travel in cleartext over plain HTTP. Put a TLS
      # reverse proxy in front before publishing it to other hosts.
      - "127.0.0.1:3940:3940"
    environment:
      - LINKR_API_URL=http://api:8000
    depends_on:
      - api

  # Uncomment for PostgreSQL in production (and point LINKR_DATABASE_URL at it):
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: linkr
  #     POSTGRES_USER: linkr
  #     POSTGRES_PASSWORD: linkr
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

volumes:
  linkr-data:
  # pgdata:
