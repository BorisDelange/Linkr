image: node:22-alpine

stages:
  - quality
  - build
  - deploy

# ---------------------------------------------------------------------------
# Quality gate. Runs on every branch/MR.
#
# All three checks are now BLOCKING — the legacy backlog has been cleared
# (ESLint errors: 0, TypeScript errors: 0). Keep them at zero.
#   - test:      BLOCKING — the suite is green.
#   - lint:      BLOCKING — ESLint errors at 0 (only non-gating warnings remain).
#   - typecheck: BLOCKING — `tsc -b` is clean.
# ---------------------------------------------------------------------------

.node_setup: &node_setup
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - apps/web/node_modules/
  before_script:
    - npm ci

test:
  stage: quality
  <<: *node_setup
  script:
    - cd apps/web && npm run test

lint:
  stage: quality
  <<: *node_setup
  script:
    - cd apps/web && npm run lint

typecheck:
  stage: quality
  <<: *node_setup
  script:
    - cd apps/web && npm run typecheck

build:
  stage: build
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - apps/web/node_modules/
  script:
    - npm ci
    - cd apps/web && npx vite build --base /
  artifacts:
    paths:
      - apps/web/dist

pages:
  stage: deploy
  dependencies:
    - build
  script:
    - mkdir -p public
    - cp -r apps/web/dist/* public/
    # Headers for SharedArrayBuffer (required by DuckDB-WASM, Pyodide, webR)
    - |
      cat > public/_headers <<'EOF'
      /*
        Cross-Origin-Opener-Policy: same-origin
        Cross-Origin-Embedder-Policy: credentialless
      EOF
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
