image: node:22-alpine

stages:
  - build
  - deploy

# ---------------------------------------------------------------------------
# Quality gate (test / lint / typecheck) runs LOCALLY via the pre-push hook
# (scripts/git-hooks/pre-push) before code ever leaves a machine, so it is no
# longer duplicated here — the CI quality stage was slow (~7 min) and prone to
# `context deadline exceeded` runner failures. Re-add it later if we ever need
# a server-side net (e.g. for pushes made with --no-verify).
# ---------------------------------------------------------------------------

build:
  stage: build
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - apps/web/node_modules/
      # The cloned default-data repos. Re-fetching them every pipeline means
      # re-pulling the LFS Parquet too; the script reuses this checkout when it
      # is present and only fetches the pinned refs it is missing.
      - .cache/default-data/
  script:
    # The default data is NOT in this repo (see CLAUDE.md): a WASM build has no
    # git client, so the seed has to be baked in at build time. The alpine image
    # ships neither git nor git-lfs, and without them this step fails loudly
    # rather than publishing a site with no default content.
    - apk add --no-cache git git-lfs
    - npm ci
    - npm run data:fetch
    - cd apps/web && npx vite build --base /
  artifacts:
    paths:
      - apps/web/dist

pages:
  stage: deploy
  dependencies:
    - build
  script:
    - mkdir -p public
    - cp -r apps/web/dist/* public/
    # The app routes client-side (BrowserRouter), so a deep link like
    # /workspaces/<id>/home has no file behind it and Pages answers 404 before any
    # JS runs — only the root ever loaded. Pages serves 404.html for an unknown
    # path, so making it the app lets React read the URL and render the right page,
    # which is what allows a link into a specific project to be shared or
    # documented. The status stays 404 (crawlers see it, users do not) — the cost of
    # BrowserRouter on static hosting. Assets are absolute (--base /), so they
    # resolve from any depth.
    - cp public/index.html public/404.html
    # Headers for SharedArrayBuffer (required by DuckDB-WASM, Pyodide, webR)
    - |
      cat > public/_headers <<'EOF'
      /*
        Cross-Origin-Opener-Policy: same-origin
        Cross-Origin-Embedder-Policy: credentialless
      EOF
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
