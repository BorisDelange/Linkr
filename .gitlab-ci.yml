image: node:22-alpine

stages:
  - build
  - deploy

# ---------------------------------------------------------------------------
# Quality gate (test / lint / typecheck) runs LOCALLY via the pre-push hook
# (scripts/git-hooks/pre-push) before code ever leaves a machine, so it is no
# longer duplicated here — the CI quality stage was slow (~7 min) and prone to
# `context deadline exceeded` runner failures. Re-add it later if we ever need
# a server-side net (e.g. for pushes made with --no-verify).
# ---------------------------------------------------------------------------

build:
  stage: build
  # Branches only. A tag pipeline builds and publishes the Docker images
  # instead (see `docker` below), and the static site it would produce here is
  # already published from the default branch.
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - apps/web/node_modules/
      # The cloned default-data repos. Re-fetching them every pipeline means
      # re-pulling the LFS Parquet too; the script reuses this checkout when it
      # is present and only fetches the pinned refs it is missing.
      - .cache/default-data/
  script:
    # The default data is NOT in this repo (see CLAUDE.md): a WASM build has no
    # git client, so the seed has to be baked in at build time. The alpine image
    # ships neither git nor git-lfs, and without them this step fails loudly
    # rather than publishing a site with no default content.
    - apk add --no-cache git git-lfs
    - npm ci
    - npm run data:fetch
    - cd apps/web && npx vite build --base /
  artifacts:
    paths:
      - apps/web/dist

pages:
  stage: deploy
  dependencies:
    - build
  script:
    - mkdir -p public
    - cp -r apps/web/dist/* public/
    # The app routes client-side (BrowserRouter), so a deep link like
    # /workspaces/<id>/home has no file behind it and Pages answers 404 before any
    # JS runs — only the root ever loaded. Pages serves 404.html for an unknown
    # path, so making it the app lets React read the URL and render the right page,
    # which is what allows a link into a specific project to be shared or
    # documented. The status stays 404 (crawlers see it, users do not) — the cost of
    # BrowserRouter on static hosting. Assets are absolute (--base /), so they
    # resolve from any depth.
    - cp public/index.html public/404.html
    # Headers for SharedArrayBuffer (required by DuckDB-WASM, Pyodide, webR)
    - |
      cat > public/_headers <<'EOF'
      /*
        Cross-Origin-Opener-Policy: same-origin
        Cross-Origin-Embedder-Policy: credentialless
      EOF
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Docker images -> Docker Hub (interhop/linkr), on a release tag only.
#
# A git tag is unique and belongs to no branch, so tagging a commit that also
# sits on main publishes ONCE — no double build between the branch pipeline and
# main, and no image overwritten unless the same tag is deliberately re-made.
#
# Both images ship from one Docker Hub repository, so the ROLE goes in the tag:
#   interhop/linkr:api-2.4.1   interhop/linkr:web-2.4.1   (+ -latest)
#
# The web image is built with VITE_API_URL=/ (server mode): it expects the api
# image beside it behind a proxy, exactly as docker/docker-compose.yml wires
# them, and does NOT work standalone. The front-only WASM build is the GitLab
# Pages site, not this image.
#
# DOCKERHUB_USER / DOCKERHUB_TOKEN are protected CI variables, so the tag
# pattern `v*` MUST be a protected tag or they are not injected and the login
# fails with an empty password.
# ---------------------------------------------------------------------------
# Kaniko, after docker:dind and Buildah both failed on GitLab.com's shared
# runners: dind needs a privileged service that never comes up ("open
# /certs/client/ca.pem: no such file or directory"), and Buildah needs a user
# namespace the runner refuses ("unshare(CLONE_NEWUSER): Operation not
# permitted"). Kaniko builds inside the job container itself — no daemon, no
# namespace, no privileges — and pushes as it goes.
#
# One image per job, because Kaniko builds exactly one context per run. They run
# in parallel, and a failure names which image broke instead of hiding it in a
# single long log.
.kaniko:
  stage: deploy
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    # Release tags only (v2.4.1). A pre-release suffix is deliberately excluded:
    # widen the pattern when we actually want to publish one.
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - VER=${CI_COMMIT_TAG#v}
    # The image stamps this into every export (entity.json appVersion) and the
    # web bundle stamps the same file, so a tag whose VERSION disagrees would
    # ship two halves claiming different formats. Fail before publishing.
    - test "$(cat VERSION)" = "$VER" || { echo "VERSION $(cat VERSION) != tag $VER"; exit 1; }
    # docker-compose.hub.yml pins the images users actually pull. It is a
    # separate file from VERSION, so it is the one that gets forgotten — and a
    # release that ships it stale points every new install at the PREVIOUS
    # version, silently. Both lines must name the tag being published.
    - |
      HUB=docker/docker-compose.hub.yml
      for role in api web; do
        grep -q "interhop/linkr:$role-$VER\$" "$HUB" || {
          echo "$HUB does not pin $role-$VER:"; grep -n 'image:' "$HUB"; exit 1; }
      done
    # Kaniko reads credentials from a Docker config file, not from a login verb.
    - mkdir -p /kaniko/.docker
    - |
      AUTH=$(printf '%s:%s' "$DOCKERHUB_USER" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')
      printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' "$AUTH" > /kaniko/.docker/config.json

docker:api:
  extends: .kaniko
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile docker/Dockerfile.api
      --destination interhop/linkr:api-$VER --destination interhop/linkr:api-latest

docker:web:
  extends: .kaniko
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile docker/Dockerfile.web
      --build-arg VITE_API_URL=/
      --destination interhop/linkr:web-$VER --destination interhop/linkr:web-latest
