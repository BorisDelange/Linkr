image: node:22-alpine

stages:
  - build
  - deploy

# ---------------------------------------------------------------------------
# Quality gate (test / lint / typecheck) runs LOCALLY via the pre-push hook
# (scripts/git-hooks/pre-push) before code ever leaves a machine, so it is no
# longer duplicated here — the CI quality stage was slow (~7 min) and prone to
# `context deadline exceeded` runner failures. Re-add it later if we ever need
# a server-side net (e.g. for pushes made with --no-verify).
# ---------------------------------------------------------------------------

build:
  stage: build
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - apps/web/node_modules/
  script:
    - npm ci
    - cd apps/web && npx vite build --base /
  artifacts:
    paths:
      - apps/web/dist

pages:
  stage: deploy
  dependencies:
    - build
  script:
    - mkdir -p public
    - cp -r apps/web/dist/* public/
    # Headers for SharedArrayBuffer (required by DuckDB-WASM, Pyodide, webR)
    - |
      cat > public/_headers <<'EOF'
      /*
        Cross-Origin-Opener-Policy: same-origin
        Cross-Origin-Embedder-Policy: credentialless
      EOF
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
