[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "linkr-api"
version = "2.0.0-dev"
description = "Linkr v2 Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "greenlet>=3.0",  # required by SQLAlchemy async on this platform/python
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7 reads bcrypt.__about__.__version__, removed in bcrypt>=4.1.
    "bcrypt>=4.0,<4.1",
    "python-multipart>=0.0.9",
    "structlog>=24.0",
    "duckdb>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.5",
    "openpyxl>=3.1",  # only to author .xlsx fixtures in tests (server reads via DuckDB)
]
postgres = [
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
]
# Packages available to server-side Python execution (parity with the browser
# Pyodide default set). Install in execution-enabled deployments.
execution = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyarrow>=15",  # pandas.read_parquet for server-side dataset injection
    "scipy>=1.11",  # statistical-tests, regression p-values, correlation
    "statsmodels>=0.14",  # regression (OLS/logit) server-side
    "lifelines>=0.27",  # kaplan-meier survival server-side
]
